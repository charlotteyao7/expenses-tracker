<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E1D5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* palette: linen, almond, umber, sage, terracotta */
    --linen: #E8E1D5;
    --paper: #F4EFE7;        /* linen lifted, for fields and the nav */
    --almond: #CEB59E;
    --almond-soft: #DDCDBC;  /* almond on linen, for unselected chips and bar tracks */
    --umber: #4C362D;
    --umber-soft: #6E5547;   /* secondary text */
    --sage: #88937B;
    --terracotta: #A46447;
    --terracotta-ink: #8A4C33; /* terracotta dark enough for small text */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--linen);
    color: var(--umber);
    font-family: "EB Garamond", Garamond, Georgia, serif;
    font-size: 18px;
    line-height: 1.45;
    font-variant-numeric: lining-nums;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 1.4rem 1.1rem 7rem; }
  h1 { font-size: 2rem; font-weight: 700; margin: 0; line-height: 1.1; }
  h2 { font-size: 1.4rem; font-weight: 700; margin: 2.4rem 0 0.5rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.4rem; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }

  .link-btn { background: none; border: 0; padding: 0.4rem 0; color: var(--umber-soft); text-decoration: underline; text-underline-offset: 0.15em; cursor: pointer; }

  label { display: block; font-size: 0.95rem; color: var(--umber-soft); margin-bottom: 0.3rem; }
  .field { margin-bottom: 1rem; }
  input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="month"], select {
    width: 100%; min-height: 2.9rem; padding: 0.5rem 0.8rem;
    border: 1px solid var(--almond); border-radius: 0.7rem; background: var(--paper);
    font-size: 1.05rem;
  }
  /* iOS Safari draws date inputs natively with their own width and centered text */
  input[type="date"], input[type="month"] {
    display: block; min-width: 0; -webkit-appearance: none; appearance: none; text-align: left;
  }
  input[type="date"]::-webkit-date-and-time-value, input[type="month"]::-webkit-date-and-time-value { text-align: left; }
  input:focus, select:focus { border-color: var(--terracotta); outline: none; box-shadow: 0 0 0 3px rgba(164,100,71,0.2); }

  /* the receipt line: the one memorable element */
  .amount-wrap {
    display: flex; align-items: baseline; gap: 0.3rem;
    padding: 0.2rem 0 0.6rem; margin-bottom: 1rem;
    border-bottom: 1px solid var(--almond);
  }
  .amount-wrap .cur { font-size: 2.4rem; color: var(--umber-soft); }
  .amount-wrap input {
    flex: 1; min-width: 0; border: 0; background: transparent; padding: 0;
    font-size: 4rem; font-weight: 500;
    font-variant-numeric: lining-nums tabular-nums; line-height: 1.1;
  }
  .amount-wrap input:focus { box-shadow: none; }
  .amount-wrap input::placeholder { color: var(--almond); }
  .amount-wrap.small input { font-size: 2.3rem; }
  .amount-wrap.small .cur { font-size: 1.5rem; }

  .split-block { margin-bottom: 0.4rem; }
  .split-head { display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem; }
  .split-head span { font-style: italic; color: var(--umber-soft); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.7rem; }
  .chip {
    border: 0; border-radius: 999px; padding: 0.45rem 0.95rem;
    min-height: 2.6rem; cursor: pointer; font-size: 1.05rem;
    background: var(--almond-soft);
  }
  .chip[aria-pressed="true"] { background: var(--terracotta); color: var(--paper); font-weight: 500; }

  .add-split { margin: 0.4rem 0 1.2rem; }
  .spread { margin: 0.2rem 0 0.8rem; }
  .spread-row { display: flex; gap: 0.6rem; }
  .spread-row label { flex: 1; min-width: 0; }
  .spread-row select, .spread-row input { margin-top: 0.3rem; color: var(--umber); }
  .spread-note { margin: 0.4rem 0 0; font-size: 0.95rem; font-style: italic; color: var(--umber-soft); }
  .total-note { font-size: 0.95rem; font-style: italic; color: var(--umber-soft); margin: 0 0 1rem; }

  .primary {
    width: 100%; min-height: 3.2rem; border: 0; border-radius: 0.8rem;
    background: var(--umber); color: var(--linen); font-weight: 500; font-size: 1.2rem; cursor: pointer;
  }
  .primary:disabled { opacity: 0.55; cursor: default; }

  #msg { min-height: 1.4rem; margin: 0.7rem 0 0; }
  #msg.err { color: var(--terracotta-ink); }
  #msg.ok { color: var(--umber); font-style: italic; }

  ul.recent { list-style: none; margin: 0; padding: 0; }
  ul.recent li {
    display: grid; grid-template-columns: 3rem 1fr auto; gap: 0.1rem 0.6rem; align-items: baseline;
    padding: 0.7rem 0; border-bottom: 1px solid var(--almond);
  }
  .r-date { color: var(--umber-soft); font-variant-numeric: lining-nums tabular-nums; }
  .r-merchant { overflow-wrap: anywhere; }
  .r-amt { font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }
  .r-cat { grid-column: 2; font-size: 0.95rem; font-style: italic; color: var(--umber-soft); }
  .r-actions { grid-column: 3; justify-self: end; display: flex; gap: 0.8rem; font-size: 0.95rem; }
  ul.recent li.editing { display: block; padding: 0.9rem 0; }
  li.editing label input, li.editing label select { margin-top: 0.3rem; color: var(--umber); }
  .edit-actions { display: flex; align-items: center; gap: 1rem; }
  .edit-actions .primary { flex: 1; }
  .empty { color: var(--umber-soft); font-style: italic; }

  /* bottom navigation */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: var(--paper); border-top: 1px solid var(--almond);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav button {
    flex: 1; min-height: 3.4rem; border: 0; background: none; cursor: pointer;
    color: var(--umber-soft); font-size: 1.1rem;
  }
  .nav button[aria-current="page"] { color: var(--terracotta-ink); font-weight: 500; font-style: italic; box-shadow: inset 0 2px 0 var(--terracotta); }

  /* dashboard */
  .month-tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem; margin-bottom: 1.2rem; -webkit-overflow-scrolling: touch; }
  .month-tabs button {
    flex: none; min-height: 2.5rem; padding: 0.35rem 1.05rem; border-radius: 999px;
    border: 1px solid var(--almond); background: transparent; cursor: pointer; font-size: 1.05rem;
  }
  .month-tabs button[aria-selected="true"] { background: var(--umber); border-color: var(--umber); color: var(--linen); }

  .dash-total { display: flex; align-items: baseline; gap: 0.3rem; }
  .dash-total .cur { font-size: 2.4rem; color: var(--umber-soft); }
  .dash-total .num { font-size: 4rem; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; line-height: 1.1; }
  .dash-sub { margin: 0.2rem 0 0; padding-bottom: 0.8rem; border-bottom: 1px solid var(--almond); color: var(--umber-soft); font-style: italic; }

  ul.cats { list-style: none; margin: 0; padding: 0; }
  li.cat { padding: 0.7rem 0; border-bottom: 1px solid var(--almond); }
  li.cat.zero .cat-amt { color: var(--umber-soft); }
  .cat-top { display: grid; grid-template-columns: 1fr auto auto; gap: 0.4rem; align-items: baseline; font-variant-numeric: lining-nums tabular-nums; }
  .cat-name { font-size: 1.1rem; }
  .cat-amt { font-weight: 500; font-size: 1.1rem; }
  .cat-of { color: var(--umber-soft); }
  .cat-sub { margin: 0.3rem 0 0; font-size: 0.95rem; color: var(--umber-soft); font-variant-numeric: lining-nums tabular-nums; }
  .cat-sub .over { color: var(--terracotta-ink); font-weight: 500; }
  .bar-track { height: 0.45rem; background: var(--almond-soft); border-radius: 999px; overflow: hidden; margin-top: 0.4rem; }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--sage); }
  li.cat.none .bar-fill { background: var(--almond); }
  li.cat .bar-fill.over { background: var(--terracotta); }
  .err-text { color: var(--terracotta-ink); }

  .hidden { display: none !important; }
  .login-card { margin-top: 18vh; }
  .login-card p { color: var(--umber-soft); font-style: italic; margin: 0.4rem 0 1.4rem; }

  @media (prefers-reduced-motion: no-preference) {
    .chip, .primary { transition: background-color 0.12s ease; }
  }
</style>
</head>
<body>
<main>

  <!-- Sign in -->
  <section id="login" class="login-card hidden">
    <h1>Expenses tracker</h1>
    <p>Sign in once. This device stays signed in after that.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button id="signin" class="primary" type="button">Sign in</button>
    <p id="login-msg" class="err" role="status"></p>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <header>
      <h1 id="title">Log a purchase</h1>
      <button id="signout" class="link-btn" type="button">Sign out</button>
    </header>

    <div id="view-log">

    <div id="lines"></div>

    <button id="add-split" class="link-btn add-split" type="button">Split between categories</button>
    <p id="total-note" class="total-note hidden"></p>

    <div class="field">
      <label for="merchant">Where or what</label>
      <input id="merchant" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Tendergreens">
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date">
    </div>

    <button id="save" class="primary" type="button">Log it</button>
    <p id="msg" role="status"></p>

    <h2>Recent entries</h2>
    <ul id="recent" class="recent"></ul>
    </div>

    <div id="view-dash" class="hidden">
      <div id="month-tabs" class="month-tabs" role="tablist" aria-label="Month"></div>
      <div id="dash-body"></div>
    </div>

    <nav id="nav" class="nav" aria-label="Main">
      <button type="button" data-view="log" aria-current="page">Log</button>
      <button type="button" data-view="dash">Dashboard</button>
    </nav>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- Connection settings (the anon key is public by design; RLS protects the data) ----
  const SUPABASE_URL = 'https://tsufnghmexnwgdtcbzyq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdWZuZ2htZXhud2dkdGNienlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODM1NTEsImV4cCI6MjEwNjQ1OTU1MX0.W43cYcXWlB8GHw8_20x1nIWhuqn0Y7rM9-3Lk-QvA5k';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- State ----
  let categories = [];   // every row from the categories table, retired ones included
  let activeCats = [];   // the categories you can log to, in display order
  let budgets = [];      // rows from category_budgets
  let rules = [];        // rows from the merchant_rules table
  let lines = [newLine()]; // one entry per category chunk of a purchase
  let months = [];         // month tabs on the dashboard, like '2026-09'
  let activeMonth = null;  // the month tab currently selected

  // Only Experiences purchases can be spread across months
  const SPREAD_CATEGORY = 'experiences';

  function newLine() { return { amount: '', categoryId: null, spreadMonths: 1, spreadStart: '' }; }

  // Retired categories point at the category they now count toward.
  // Entries keep their original category, so a future rename is just another retirement.
  function resolveCat(id) {
    let c = categories.find(x => x.id === id);
    for (let hops = 0; c && c.rolls_into && hops < 10; hops++) {
      c = categories.find(x => x.id === c.rolls_into);
    }
    return c || null;
  }
  function canSpread(categoryId) {
    const c = resolveCat(categoryId);
    return !!c && c.name.toLowerCase() === SPREAD_CATEGORY;
  }

  // ---- Small helpers ----
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function todayLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function cleanAmount(s) { return parseFloat(String(s).replace(/[^0-9.]/g, '')); }
  function money(n) { return '$' + Number(n).toFixed(2); }
  function say(text, kind) {
    const m = $('msg');
    m.textContent = text || '';
    m.className = kind || '';
  }

  // ---- Auth ----
  async function showForSession(session) {
    $('login').classList.toggle('hidden', !!session);
    $('app').classList.toggle('hidden', !session);
    if (!session) { months = []; activeMonth = null; setView('log'); }
    if (session) {
      $('date').value = $('date').value || todayLocal();
      await loadReferenceData();
      renderLines();
      loadRecent();
    }
  }

  $('signin').onclick = async () => {
    const msg = $('login-msg');
    msg.textContent = '';
    const { error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value,
    });
    if (error) msg.textContent = 'Could not sign in: ' + error.message;
  };

  $('signout').onclick = async () => { await db.auth.signOut(); };

  db.auth.onAuthStateChange((_event, session) => { showForSession(session); });

  // ---- Load categories and merchant rules ----
  async function loadReferenceData() {
    const [cats, rls, bud] = await Promise.all([
      db.from('categories').select('id,name,want_need,archived,rolls_into,sort_order').order('sort_order').order('id'),
      db.from('merchant_rules').select('merchant_pattern,default_category_id'),
      db.from('category_budgets').select('category_id,starts_month,amount').order('starts_month'),
    ]);
    if (cats.error) { say('Could not load categories: ' + cats.error.message, 'err'); return; }
    categories = cats.data;
    activeCats = categories.filter(c => !c.archived);
    rules = rls.error ? [] : rls.data;
    budgets = bud.error ? [] : bud.data;
  }

  // ---- Entry lines (amount + category chips) ----
  function renderLines() {
    const wrap = $('lines');
    wrap.replaceChildren();

    lines.forEach((line, i) => {
      const block = el('div', 'split-block');

      if (i > 0) {
        const head = el('div', 'split-head');
        head.append(el('span', '', 'Split ' + (i + 1)));
        const rm = el('button', 'link-btn', 'Remove');
        rm.type = 'button';
        rm.onclick = () => { lines.splice(i, 1); renderLines(); };
        head.append(rm);
        block.append(head);
      }

      const amtWrap = el('div', 'amount-wrap' + (i > 0 ? ' small' : ''));
      amtWrap.append(el('span', 'cur', '$'));
      const amt = document.createElement('input');
      amt.type = 'text';
      amt.inputMode = 'decimal';
      amt.placeholder = '0.00';
      amt.value = line.amount;
      amt.setAttribute('aria-label', i === 0 ? 'Amount' : 'Amount for split ' + (i + 1));
      let refreshSpread = () => {};
      amt.oninput = () => { line.amount = amt.value; updateTotal(); refreshSpread(); };
      amtWrap.append(amt);
      block.append(amtWrap);

      const row = el('div', 'chip-row');
      activeCats.forEach(c => {
        const b = el('button', 'chip', c.name);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(line.categoryId === c.id));
        b.onclick = () => { line.categoryId = c.id; renderLines(); };
        row.append(b);
      });
      block.append(row);

      if (canSpread(line.categoryId)) {
        const s = spreadFields(line, () => line.amount, () => $('date').value);
        refreshSpread = s.refresh;
        block.append(s.box);
      }
      wrap.append(block);
    });

    updateTotal();
  }

  // "Spread over N months starting M" controls, shared by the log form and the edit form.
  // state holds spreadMonths (number) and spreadStart ('2026-11'); it is changed in place.
  function spreadFields(state, getAmount, getDate) {
    const box = el('div', 'spread');
    const row = el('div', 'spread-row');

    const monthsLab = el('label', '', 'Spread over');
    const sel = document.createElement('select');
    for (let n = 1; n <= 12; n++) {
      const o = el('option', '', n === 1 ? "Don't spread" : n + ' months');
      o.value = n;
      if (n === state.spreadMonths) o.selected = true;
      sel.append(o);
    }
    monthsLab.append(sel);

    const startLab = el('label', '', 'Starting');
    const start = document.createElement('input');
    start.type = 'month';
    startLab.append(start);

    row.append(monthsLab, startLab);
    const note = el('p', 'spread-note');
    box.append(row, note);

    function refresh() {
      if (state.spreadMonths > 1 && !state.spreadStart) {
        state.spreadStart = (getDate() || todayLocal()).slice(0, 7);
      }
      start.value = state.spreadStart;
      startLab.classList.toggle('hidden', state.spreadMonths < 2);
      const amt = cleanAmount(getAmount());
      if (state.spreadMonths < 2) {
        note.textContent = 'Counts in full in the month you bought it. Spread a trip or gear across the months you use it.';
      } else {
        const end = addMonths(state.spreadStart, state.spreadMonths - 1);
        note.textContent = (amt > 0 ? money(amt / state.spreadMonths) + ' a month, ' : '')
          + monthName(state.spreadStart, 'long') + ' through ' + monthName(end, 'long') + '.';
      }
    }
    sel.onchange = () => { state.spreadMonths = Number(sel.value); refresh(); };
    start.onchange = () => { state.spreadStart = start.value; refresh(); };
    refresh();
    return { box, refresh };
  }

  // Database fields for an entry's spread, or nulls when it counts in its own month
  function spreadColumns(state, categoryId) {
    if (!canSpread(categoryId) || !(state.spreadMonths > 1) || !state.spreadStart) {
      return { spread_start: null, spread_months: null };
    }
    return { spread_start: state.spreadStart + '-01', spread_months: state.spreadMonths };
  }

  function updateTotal() {
    const note = $('total-note');
    if (lines.length < 2) { note.classList.add('hidden'); return; }
    const sum = lines.reduce((s, l) => s + (cleanAmount(l.amount) || 0), 0);
    note.textContent = 'Split total ' + money(sum) + '. This should match what the card charged.';
    note.classList.remove('hidden');
  }

  // Adding a split divides the current total evenly across all splits
  // and defaults the new split to Generosity (splits are usually with people)
  $('add-split').onclick = () => {
    const total = lines.reduce((s, l) => s + (cleanAmount(l.amount) || 0), 0);
    const added = newLine();
    const generosity = categories.find(c => c.name.toLowerCase().includes('generosity'));
    if (generosity) added.categoryId = generosity.id;
    lines.push(added);
    if (total > 0) {
      const cents = Math.round(total * 100);
      const each = Math.floor(cents / lines.length);
      // Any leftover cent goes to the first split so the total still matches
      lines.forEach((l, i) => {
        l.amount = ((each + (i === 0 ? cents - each * lines.length : 0)) / 100).toFixed(2);
      });
    }
    renderLines();
  };

  // Pre-pick a category when the merchant matches a saved rule
  $('merchant').oninput = () => {
    if (lines[0].categoryId) return;
    const m = $('merchant').value.trim().toLowerCase();
    if (m.length < 3) return;
    const hit = rules.find(r => {
      const p = r.merchant_pattern.toLowerCase();
      return m.includes(p) || p.includes(m);
    });
    const cat = hit && resolveCat(hit.default_category_id);
    if (cat) { lines[0].categoryId = cat.id; renderLines(); }
  };

  // ---- Save ----
  $('save').onclick = async () => {
    say('');
    const merchant = $('merchant').value.trim();
    const date = $('date').value;
    if (!merchant) return say('Add where or what this was.', 'err');
    if (!date) return say('Pick a date.', 'err');

    const rows = [];
    for (let i = 0; i < lines.length; i++) {
      const amt = cleanAmount(lines[i].amount);
      const label = lines.length > 1 ? ' for split ' + (i + 1) : '';
      if (!(amt > 0)) return say('Enter an amount' + label + '.', 'err');
      if (!lines[i].categoryId) return say('Pick a category' + label + '.', 'err');
      rows.push({
        date,
        merchant,
        category_id: lines[i].categoryId,
        amount: Math.round(amt * 100) / 100,
        source: 'manual',
        ...spreadColumns(lines[i], lines[i].categoryId),
      });
    }

    const btn = $('save');
    btn.disabled = true;
    const { error } = await db.from('line_items').insert(rows);
    btn.disabled = false;

    if (error) return say('Could not save: ' + error.message, 'err');

    $('merchant').value = '';
    lines = [newLine()];
    renderLines();
    say('Logged ' + rows.length + (rows.length > 1 ? ' entries.' : ' entry.'), 'ok');
    loadRecent();
  };

  // ---- Recent entries ----
  async function loadRecent() {
    const list = $('recent');
    const { data, error } = await db
      .from('line_items')
      .select('id,date,merchant,amount,category_id,spread_start,spread_months')
      .order('date', { ascending: false })
      .order('id', { ascending: false })
      .limit(15);

    list.replaceChildren();
    if (error) { list.append(el('li', 'empty', 'Could not load entries: ' + error.message)); return; }
    if (!data.length) { list.append(el('li', 'empty', 'Nothing logged yet. Your first entry will show up here.')); return; }

    data.forEach(row => {
      const li = el('li');
      const [, mm, dd] = row.date.split('-');
      li.append(el('span', 'r-date', Number(mm) + '/' + Number(dd)));
      li.append(el('span', 'r-merchant', row.merchant));
      li.append(el('span', 'r-amt', money(row.amount)));
      li.append(el('span', 'r-cat', categoryLabel(row)));
      const actions = el('span', 'r-actions');
      const edit = el('button', 'link-btn', 'Edit');
      edit.type = 'button';
      edit.onclick = () => startEdit(li, row);
      const del = el('button', 'link-btn', 'Delete');
      del.type = 'button';
      del.onclick = async () => {
        if (!confirm('Delete ' + row.merchant + ' (' + money(row.amount) + ')?')) return;
        const { data: gone, error: delErr } = await db.from('line_items').delete().eq('id', row.id).select('id');
        if (delErr) return say('Could not delete: ' + delErr.message, 'err');
        // Row-level security turns a blocked delete into a silent no-op, so check something was removed
        if (!gone.length) return say('Could not delete: the database did not allow it (check the delete policy on line_items).', 'err');
        loadRecent();
      };
      actions.append(edit, del);
      li.append(actions);
      list.append(li);
    });
  }

  // "Eating Out (was Food - social) · spread over 3 months from Nov"
  function categoryLabel(row) {
    const own = categories.find(c => c.id === row.category_id);
    const now = resolveCat(row.category_id);
    let text = now ? now.name : 'Uncategorized';
    if (own && now && own.id !== now.id) text += ' (was ' + own.name + ')';
    if (row.spread_months > 1) {
      text += ' · spread over ' + row.spread_months + ' months from ' + monthName(row.spread_start.slice(0, 7));
    }
    return text;
  }

  // Swap a recent entry for an inline form to change it in place
  function startEdit(li, row) {
    li.replaceChildren();
    li.className = 'editing';

    function field(labelText, input) {
      const f = el('div', 'field');
      const lab = el('label', '', labelText);
      lab.append(input);
      f.append(lab);
      return f;
    }

    const merchant = document.createElement('input');
    merchant.type = 'text';
    merchant.value = row.merchant;

    const amount = document.createElement('input');
    amount.type = 'text';
    amount.inputMode = 'decimal';
    amount.value = Number(row.amount).toFixed(2);

    const date = document.createElement('input');
    date.type = 'date';
    date.value = row.date;

    const cat = document.createElement('select');
    // A retired category stays selectable for its own entries so an edit doesn't silently move them
    const own = categories.find(c => c.id === row.category_id);
    if (own && own.archived) {
      const o = el('option', '', own.name + ' (counts as ' + resolveCat(own.id).name + ')');
      o.value = own.id;
      o.selected = true;
      cat.append(o);
    }
    activeCats.forEach(c => {
      const o = el('option', '', c.name);
      o.value = c.id;
      if (c.id === row.category_id) o.selected = true;
      cat.append(o);
    });

    const spread = {
      spreadMonths: row.spread_months || 1,
      spreadStart: row.spread_start ? row.spread_start.slice(0, 7) : '',
    };
    const spreadSlot = el('div');
    function showSpread() {
      spreadSlot.replaceChildren();
      if (canSpread(Number(cat.value))) {
        spreadSlot.append(spreadFields(spread, () => amount.value, () => date.value).box);
      }
    }
    cat.onchange = showSpread;
    showSpread();

    const err = el('p', 'err-text');
    const actions = el('div', 'edit-actions');
    const save = el('button', 'primary', 'Save');
    save.type = 'button';
    const cancel = el('button', 'link-btn', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = () => loadRecent();

    save.onclick = async () => {
      const amt = cleanAmount(amount.value);
      if (!merchant.value.trim()) { err.textContent = 'Add where or what this was.'; return; }
      if (!(amt > 0)) { err.textContent = 'Enter an amount.'; return; }
      if (!date.value) { err.textContent = 'Pick a date.'; return; }
      save.disabled = true;
      const { data: changed, error } = await db.from('line_items').update({
        merchant: merchant.value.trim(),
        amount: Math.round(amt * 100) / 100,
        date: date.value,
        category_id: Number(cat.value),
        ...spreadColumns(spread, Number(cat.value)),
      }).eq('id', row.id).select('id');
      save.disabled = false;
      if (error) { err.textContent = 'Could not save: ' + error.message; return; }
      if (!changed.length) { err.textContent = 'Could not save: the database did not allow it (check the update policy on line_items).'; return; }
      loadRecent();
    };

    actions.append(save, cancel);
    li.append(
      field('Where or what', merchant),
      field('Amount', amount),
      field('Date', date),
      field('Category', cat),
      spreadSlot,
      err,
      actions,
    );
    merchant.focus();
  }

  // ---- Dashboard ----
  const FIRST_MONTH = '2026-09'; // the earliest month tab, even before it has data
  let allItems = [];             // every entry, loaded when the dashboard opens

  function nextYM(ym) {
    const [y, m] = ym.split('-').map(Number);
    return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0');
  }
  function addMonths(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const t = y * 12 + (m - 1) + n;
    return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0');
  }
  function monthName(ym, style) {
    const [y, m] = ym.split('-').map(Number);
    const opts = style === 'long' ? { month: 'long', year: 'numeric' } : { month: 'short' };
    return new Date(y, m - 1, 1).toLocaleString('en-US', opts);
  }
  function bigMoney(n) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(part, whole) { return whole > 0 ? (part / whole) * 100 : 0; }

  function setView(name) {
    $('view-log').classList.toggle('hidden', name !== 'log');
    $('view-dash').classList.toggle('hidden', name !== 'dash');
    $('title').textContent = name === 'log' ? 'Log a purchase' : 'Dashboard';
    document.querySelectorAll('#nav button').forEach(b => {
      if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (name === 'dash') refreshDashboard();
  }
  document.querySelectorAll('#nav button').forEach(b => { b.onclick = () => setView(b.dataset.view); });

  async function refreshDashboard() {
    const { data, error } = await db
      .from('line_items')
      .select('id,date,merchant,amount,category_id,spread_start,spread_months')
      .limit(10000);
    if (error) { $('dash-body').replaceChildren(el('p', 'err-text', 'Could not load entries: ' + error.message)); return; }
    allItems = data;
    buildMonths();
    renderMonthTabs();
    renderDashboard();
  }

  // The months an entry counts in, to the cent. A spread entry is split evenly,
  // with any leftover cent in its first month.
  function allocations(item) {
    const n = item.spread_months > 1 && item.spread_start ? item.spread_months : 1;
    const start = (n > 1 ? item.spread_start : item.date).slice(0, 7);
    const cents = Math.round(Number(item.amount) * 100);
    const each = Math.floor(cents / n);
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push({ ym: addMonths(start, i), amt: (each + (i === 0 ? cents - each * n : 0)) / 100, part: i + 1, of: n });
    }
    return out;
  }

  // Spending per month per current category: Map ym -> Map categoryId -> amount (0 = uncategorized)
  function spendByMonth() {
    const spent = new Map();
    allItems.forEach(it => {
      const c = resolveCat(it.category_id);
      const key = c ? c.id : 0;
      allocations(it).forEach(a => {
        if (!spent.has(a.ym)) spent.set(a.ym, new Map());
        const m = spent.get(a.ym);
        m.set(key, (m.get(key) || 0) + a.amt);
      });
    });
    return spent;
  }

  // A category's budget in a month: its latest budget that has started, or null for none
  function budgetFor(catId, ym) {
    let amt = null;
    budgets.forEach(b => { if (b.category_id === catId && b.starts_month.slice(0, 7) <= ym) amt = Number(b.amount); });
    return amt;
  }

  // Leftover (+) or overspend (-) from every budgeted month before ym
  function carryInto(catId, ym, spent) {
    const first = budgets.find(b => b.category_id === catId);
    if (!first) return 0;
    let carry = 0;
    for (let m = first.starts_month.slice(0, 7); m < ym; m = nextYM(m)) {
      const b = budgetFor(catId, m);
      if (b === null) continue;
      carry += b - ((spent.get(m) && spent.get(m).get(catId)) || 0);
    }
    return Math.round(carry * 100) / 100;
  }

  // Month tabs run from the first month through the current month, plus any month an entry counts in
  function buildMonths() {
    const thisMonth = todayLocal().slice(0, 7);
    let start = FIRST_MONTH, end = thisMonth;
    allItems.forEach(it => allocations(it).forEach(a => {
      if (a.ym < start) start = a.ym;
      if (a.ym > end) end = a.ym;
    }));
    months = [];
    for (let ym = start; ym <= end; ym = nextYM(ym)) months.push(ym);
    if (!activeMonth || !months.includes(activeMonth)) activeMonth = thisMonth;
  }

  function renderMonthTabs() {
    const wrap = $('month-tabs');
    wrap.replaceChildren();
    if (!months.length) return;
    const multiYear = months[0].slice(0, 4) !== months[months.length - 1].slice(0, 4);
    months.forEach(ym => {
      let label = monthName(ym);
      if (multiYear) label += ' ' + ym.slice(2, 4);
      const b = el('button', '', label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', monthName(ym, 'long'));
      b.setAttribute('aria-selected', String(ym === activeMonth));
      b.onclick = () => { activeMonth = ym; renderMonthTabs(); renderDashboard(); };
      wrap.append(b);
    });
    const sel = wrap.querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function signedMoney(n) { return (n < 0 ? '−' : '+') + money(Math.abs(n)); }

  // One category: spent against what's available, or a share of the month when it has no budget
  function catRow(c, amt, info, total) {
    const over = info && amt > info.avail + 0.005;
    const li = el('li', 'cat' + (c ? '' : ' none') + (amt === 0 ? ' zero' : ''));
    const top = el('div', 'cat-top');
    top.append(el('span', 'cat-name', c ? c.name : 'Uncategorized'));
    top.append(el('span', 'cat-amt', money(amt)));
    top.append(el('span', 'cat-of', info ? 'of ' + money(info.avail) : ''));
    li.append(top);

    const track = el('div', 'bar-track');
    track.setAttribute('aria-hidden', 'true');
    const fill = el('div', 'bar-fill' + (over ? ' over' : ''));
    const width = info ? (info.avail > 0 ? pct(amt, info.avail) : (amt > 0 ? 100 : 0)) : pct(amt, total);
    fill.style.width = Math.min(width, 100) + '%';
    track.append(fill);
    li.append(track);

    const sub = el('p', 'cat-sub');
    if (info) {
      sub.append(el('span', over ? 'over' : '', over ? money(amt - info.avail) + ' over' : money(info.avail - amt) + ' left'));
      let detail = ' · ' + money(info.budget) + ' budget';
      if (info.carry !== 0) detail += ' ' + signedMoney(info.carry) + ' carried over';
      sub.append(document.createTextNode(detail));
    } else {
      sub.textContent = 'No budget · ' + pct(amt, total).toFixed(1) + '% of the month';
    }
    li.append(sub);
    return li;
  }

  function renderDashboard() {
    const body = $('dash-body');
    const ym = activeMonth;
    body.replaceChildren();

    const spent = spendByMonth();
    const month = spent.get(ym) || new Map();
    const parts = [];
    allItems.forEach(it => allocations(it).forEach(a => { if (a.ym === ym) parts.push({ it, a }); }));
    const hasBudget = activeCats.some(c => budgetFor(c.id, ym) !== null);

    if (!parts.length && !hasBudget) {
      body.append(el('p', 'empty', 'Nothing logged for ' + monthName(ym, 'long') + ' yet. Entries dated in this month, whether logged here or imported, will show up on this tab.'));
      return;
    }

    let total = 0;
    month.forEach(v => { total += v; });

    // Month total
    const totalRow = el('div', 'dash-total');
    totalRow.append(el('span', 'cur', '$'));
    totalRow.append(el('span', 'num', bigMoney(total)));
    body.append(totalRow);
    const spreadIn = parts.filter(p => p.a.of > 1).length;
    body.append(el('p', 'dash-sub', parts.length + (parts.length === 1 ? ' entry' : ' entries') + ' in ' + monthName(ym, 'long')
      + (spreadIn ? ', ' + spreadIn + ' of them spread across months' : '')));

    // Per category budget, carryover and spending
    const rows = activeCats.map(c => {
      const budget = budgetFor(c.id, ym);
      const amt = month.get(c.id) || 0;
      if (budget === null) return { c, amt, info: null };
      const carry = carryInto(c.id, ym, spent);
      return { c, amt, info: { budget, carry, avail: Math.round((budget + carry) * 100) / 100 } };
    });
    const uncategorized = month.get(0) || 0;

    // By category, in the order you log them
    body.append(el('h2', '', 'By category'));
    const list = el('ul', 'cats');
    rows.forEach(r => list.append(catRow(r.c, r.amt, r.info, total)));
    if (uncategorized > 0) list.append(catRow(null, uncategorized, null, total));
    body.append(list);

    // Purchases spread into this month
    const spreadParts = parts.filter(p => p.a.of > 1);
    if (spreadParts.length) {
      body.append(el('h2', '', 'Spread into this month'));
      const sl = el('ul', 'cats');
      spreadParts.forEach(({ it, a }) => {
        const li = el('li', 'cat');
        const top = el('div', 'cat-top');
        top.append(el('span', 'cat-name', it.merchant));
        top.append(el('span', 'cat-amt', money(a.amt)));
        top.append(el('span', 'cat-of', ''));
        li.append(top);
        const [, mm, dd] = it.date.split('-');
        li.append(el('p', 'cat-sub', 'Month ' + a.part + ' of ' + a.of + ' · ' + money(it.amount)
          + ' bought ' + Number(mm) + '/' + Number(dd)));
        sl.append(li);
      });
      body.append(sl);
    }
  }

  // ---- Start ----
  db.auth.getSession().then(({ data }) => showForSession(data.session));
</script>
</body>
</html>
