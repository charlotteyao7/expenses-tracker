<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expenses tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4EF;
    --card: #FBFCFA;
    --ink: #16241D;
    --muted: #5E6E65;
    --line: #D5DBD3;
    --spruce: #1E5A45;
    --need: #DCEBE2;
    --want: #F3E3D3;
    --danger: #A3321F;
    --ochre: #B7791F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1.1rem 7rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; font-weight: 700; margin: 2.2rem 0 0.6rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.2rem; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--spruce); outline-offset: 2px; }

  .link-btn { background: none; border: 0; padding: 0.4rem 0; color: var(--muted); text-decoration: underline; cursor: pointer; }

  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.3rem; }
  .field { margin-bottom: 1rem; }
  input[type="text"], input[type="email"], input[type="password"], input[type="date"] {
    width: 100%; min-height: 2.9rem; padding: 0.55rem 0.8rem;
    border: 1.5px solid var(--line); border-radius: 0.6rem; background: var(--card);
    font-size: 1rem;
  }
  /* iOS Safari draws date inputs natively with their own width and centered text */
  input[type="date"] {
    display: block; min-width: 0; -webkit-appearance: none; appearance: none; text-align: left;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  input:focus { border-color: var(--spruce); outline: none; box-shadow: 0 0 0 3px rgba(30,90,69,0.18); }

  /* the receipt line: the one memorable element */
  .amount-wrap {
    display: flex; align-items: baseline; gap: 0.3rem;
    padding: 0.4rem 0 0.7rem; margin-bottom: 1rem;
    border-bottom: 2px dashed var(--line);
  }
  .amount-wrap .cur { font-size: 2.2rem; font-weight: 500; color: var(--muted); }
  .amount-wrap input {
    flex: 1; min-width: 0; border: 0; background: transparent; padding: 0;
    font-size: 3.6rem; font-weight: 700; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .amount-wrap input:focus { box-shadow: none; }
  .amount-wrap input::placeholder { color: #B9C3BC; }
  .amount-wrap.small input { font-size: 2rem; }
  .amount-wrap.small .cur { font-size: 1.4rem; }

  .split-block { margin-bottom: 0.4rem; }
  .split-head { display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem; }
  .split-head span { font-size: 0.9rem; color: var(--muted); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; margin-bottom: 0.55rem; }
  .group-label { width: 3.4rem; font-size: 0.85rem; color: var(--muted); }
  .chip {
    border: 1.5px solid transparent; border-radius: 999px; padding: 0.5rem 0.85rem;
    min-height: 2.5rem; cursor: pointer; font-size: 0.95rem;
  }
  .chip.need { background: var(--need); }
  .chip.want { background: var(--want); }
  .chip[aria-pressed="true"] { background: var(--spruce); color: #fff; font-weight: 500; }

  .add-split { margin: 0.4rem 0 1.2rem; }
  .total-note { font-size: 0.9rem; color: var(--muted); margin: 0 0 1rem; font-variant-numeric: tabular-nums; }

  .primary {
    width: 100%; min-height: 3.2rem; border: 0; border-radius: 0.8rem;
    background: var(--spruce); color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  }
  .primary:disabled { opacity: 0.55; cursor: default; }

  #msg { min-height: 1.4rem; margin: 0.7rem 0 0; font-size: 0.95rem; }
  #msg.err { color: var(--danger); }
  #msg.ok { color: var(--spruce); font-weight: 500; }

  ul.recent { list-style: none; margin: 0; padding: 0; }
  ul.recent li {
    display: grid; grid-template-columns: 3rem 1fr auto; gap: 0.2rem 0.6rem; align-items: baseline;
    padding: 0.65rem 0; border-bottom: 1px solid var(--line);
  }
  .r-date { color: var(--muted); font-variant-numeric: tabular-nums; }
  .r-merchant { overflow-wrap: anywhere; }
  .r-amt { font-weight: 500; font-variant-numeric: tabular-nums; }
  .r-cat { grid-column: 2; font-size: 0.85rem; color: var(--muted); }
  .r-del { grid-column: 3; justify-self: end; font-size: 0.85rem; }
  .empty { color: var(--muted); }


  /* bottom navigation */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav button {
    flex: 1; min-height: 3.4rem; border: 0; background: none; cursor: pointer;
    color: var(--muted); font-weight: 500;
  }
  .nav button[aria-current="page"] { color: var(--spruce); font-weight: 700; box-shadow: inset 0 3px 0 var(--spruce); }

  /* dashboard */
  .month-tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem; margin-bottom: 1rem; -webkit-overflow-scrolling: touch; }
  .month-tabs button {
    flex: none; min-height: 2.5rem; padding: 0.4rem 1rem; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--card); cursor: pointer;
  }
  .month-tabs button[aria-selected="true"] { background: var(--spruce); border-color: var(--spruce); color: #fff; font-weight: 500; }

  .dash-total { display: flex; align-items: baseline; gap: 0.3rem; padding: 0.2rem 0 0.2rem; }
  .dash-total .cur { font-size: 2.2rem; font-weight: 500; color: var(--muted); }
  .dash-total .num { font-size: 3.6rem; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .dash-sub { margin: 0 0 1rem; padding-bottom: 0.7rem; border-bottom: 2px dashed var(--line); color: var(--muted); }

  .budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; font-variant-numeric: tabular-nums; }
  .budget-top .spent { font-weight: 700; }
  .budget-top .left { color: var(--muted); }
  .budget-top .left.over { color: var(--danger); font-weight: 500; }
  .budget-track { height: 1.1rem; border-radius: 0.55rem; overflow: hidden; background: var(--line); margin-top: 0.4rem; }
  .budget-fill { height: 100%; background: var(--spruce); }
  .budget-fill.over { background: var(--danger); }
  .footnote { font-size: 0.85rem; color: var(--muted); margin: 0.5rem 0 0; }

  .split-bar { display: flex; height: 1.1rem; border-radius: 0.55rem; overflow: hidden; background: var(--line); }
  .split-bar .n { background: var(--spruce); }
  .split-bar .w { background: var(--ochre); }
  .legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; margin-top: 0.6rem; font-variant-numeric: tabular-nums; }
  .legend .sw { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; margin-right: 0.4rem; }
  .legend .sw.n { background: var(--spruce); }
  .legend .sw.w { background: var(--ochre); }

  .group-head { display: flex; justify-content: space-between; align-items: baseline; margin: 1.4rem 0 0.3rem; }
  .group-head h3 { margin: 0; font-size: 1rem; font-weight: 700; }
  .group-head span { font-variant-numeric: tabular-nums; color: var(--muted); }
  ul.cats { list-style: none; margin: 0; padding: 0; }
  li.cat { padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
  li.cat.zero { color: var(--muted); }
  .cat-top { display: grid; grid-template-columns: 1fr auto 3.6rem; gap: 0.5rem; align-items: baseline; font-variant-numeric: tabular-nums; }
  .cat-amt { font-weight: 500; }
  .cat-pct { text-align: right; color: var(--muted); font-size: 0.9rem; }
  .bar-track { height: 0.5rem; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 0.35rem; }
  .bar-fill { height: 100%; border-radius: 999px; }
  li.cat.need .bar-fill { background: var(--spruce); }
  li.cat.want .bar-fill { background: var(--ochre); }
  .err-text { color: var(--danger); }

  .hidden { display: none !important; }
  .login-card { margin-top: 18vh; }
  .login-card p { color: var(--muted); margin: 0.4rem 0 1.4rem; }

  @media (prefers-reduced-motion: no-preference) {
    .chip, .primary { transition: background-color 0.12s ease; }
  }
</style>
</head>
<body>
<main>

  <!-- Sign in -->
  <section id="login" class="login-card hidden">
    <h1>Expenses tracker</h1>
    <p>Sign in once. This device stays signed in after that.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button id="signin" class="primary" type="button">Sign in</button>
    <p id="login-msg" class="err" role="status"></p>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <header>
      <h1 id="title">Log a purchase</h1>
      <button id="signout" class="link-btn" type="button">Sign out</button>
    </header>

    <div id="view-log">

    <div id="lines"></div>

    <button id="add-split" class="link-btn add-split" type="button">Split between categories</button>
    <p id="total-note" class="total-note hidden"></p>

    <div class="field">
      <label for="merchant">Where or what</label>
      <input id="merchant" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Tendergreens">
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" type="date">
    </div>

    <button id="save" class="primary" type="button">Log it</button>
    <p id="msg" role="status"></p>

    <h2>Recent entries</h2>
    <ul id="recent" class="recent"></ul>
    </div>

    <div id="view-dash" class="hidden">
      <div id="month-tabs" class="month-tabs" role="tablist" aria-label="Month"></div>
      <div id="dash-body"></div>
    </div>

    <nav id="nav" class="nav" aria-label="Main">
      <button type="button" data-view="log" aria-current="page">Log</button>
      <button type="button" data-view="dash">Dashboard</button>
    </nav>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- Connection settings (the anon key is public by design; RLS protects the data) ----
  const SUPABASE_URL = 'https://tsufnghmexnwgdtcbzyq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzdWZuZ2htZXhud2dkdGNienlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODM1NTEsImV4cCI6MjEwNjQ1OTU1MX0.W43cYcXWlB8GHw8_20x1nIWhuqn0Y7rM9-3Lk-QvA5k';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- State ----
  let categories = [];   // rows from the categories table
  let rules = [];        // rows from the merchant_rules table
  let lines = [newLine()]; // one entry per category chunk of a purchase
  let months = [];         // month tabs on the dashboard, like '2026-09'
  let activeMonth = null;  // the month tab currently selected

  function newLine() { return { amount: '', categoryId: null }; }

  // ---- Small helpers ----
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function todayLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function cleanAmount(s) { return parseFloat(String(s).replace(/[^0-9.]/g, '')); }
  function money(n) { return '$' + Number(n).toFixed(2); }
  function say(text, kind) {
    const m = $('msg');
    m.textContent = text || '';
    m.className = kind || '';
  }

  // ---- Auth ----
  async function showForSession(session) {
    $('login').classList.toggle('hidden', !!session);
    $('app').classList.toggle('hidden', !session);
    if (!session) { months = []; activeMonth = null; setView('log'); }
    if (session) {
      $('date').value = $('date').value || todayLocal();
      await loadReferenceData();
      renderLines();
      loadRecent();
    }
  }

  $('signin').onclick = async () => {
    const msg = $('login-msg');
    msg.textContent = '';
    const { error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value,
    });
    if (error) msg.textContent = 'Could not sign in: ' + error.message;
  };

  $('signout').onclick = async () => { await db.auth.signOut(); };

  db.auth.onAuthStateChange((_event, session) => { showForSession(session); });

  // ---- Load categories and merchant rules ----
  async function loadReferenceData() {
    const [cats, rls] = await Promise.all([
      db.from('categories').select('id,name,want_need').order('id'),
      db.from('merchant_rules').select('merchant_pattern,default_category_id'),
    ]);
    if (cats.error) { say('Could not load categories: ' + cats.error.message, 'err'); return; }
    categories = cats.data;
    rules = rls.error ? [] : rls.data;
  }

  // ---- Entry lines (amount + category chips) ----
  function renderLines() {
    const wrap = $('lines');
    wrap.replaceChildren();

    lines.forEach((line, i) => {
      const block = el('div', 'split-block');

      if (i > 0) {
        const head = el('div', 'split-head');
        head.append(el('span', '', 'Split ' + (i + 1)));
        const rm = el('button', 'link-btn', 'Remove');
        rm.type = 'button';
        rm.onclick = () => { lines.splice(i, 1); renderLines(); };
        head.append(rm);
        block.append(head);
      }

      const amtWrap = el('div', 'amount-wrap' + (i > 0 ? ' small' : ''));
      amtWrap.append(el('span', 'cur', '$'));
      const amt = document.createElement('input');
      amt.type = 'text';
      amt.inputMode = 'decimal';
      amt.placeholder = '0.00';
      amt.value = line.amount;
      amt.setAttribute('aria-label', i === 0 ? 'Amount' : 'Amount for split ' + (i + 1));
      amt.oninput = () => { line.amount = amt.value; updateTotal(); };
      amtWrap.append(amt);
      block.append(amtWrap);

      for (const group of ['Need', 'Want']) {
        const row = el('div', 'chip-row');
        row.append(el('span', 'group-label', group === 'Need' ? 'Needs' : 'Wants'));
        categories.filter(c => c.want_need === group).forEach(c => {
          const b = el('button', 'chip ' + group.toLowerCase(), c.name);
          b.type = 'button';
          b.setAttribute('aria-pressed', String(line.categoryId === c.id));
          b.onclick = () => { line.categoryId = c.id; renderLines(); };
          row.append(b);
        });
        block.append(row);
      }
      wrap.append(block);
    });

    updateTotal();
  }

  function updateTotal() {
    const note = $('total-note');
    if (lines.length < 2) { note.classList.add('hidden'); return; }
    const sum = lines.reduce((s, l) => s + (cleanAmount(l.amount) || 0), 0);
    note.textContent = 'Split total ' + money(sum) + '. This should match what the card charged.';
    note.classList.remove('hidden');
  }

  $('add-split').onclick = () => { lines.push(newLine()); renderLines(); };

  // Pre-pick a category when the merchant matches a saved rule
  $('merchant').oninput = () => {
    if (lines[0].categoryId) return;
    const m = $('merchant').value.trim().toLowerCase();
    if (m.length < 3) return;
    const hit = rules.find(r => {
      const p = r.merchant_pattern.toLowerCase();
      return m.includes(p) || p.includes(m);
    });
    if (hit) { lines[0].categoryId = hit.default_category_id; renderLines(); }
  };

  // ---- Save ----
  $('save').onclick = async () => {
    say('');
    const merchant = $('merchant').value.trim();
    const date = $('date').value;
    if (!merchant) return say('Add where or what this was.', 'err');
    if (!date) return say('Pick a date.', 'err');

    const rows = [];
    for (let i = 0; i < lines.length; i++) {
      const amt = cleanAmount(lines[i].amount);
      const label = lines.length > 1 ? ' for split ' + (i + 1) : '';
      if (!(amt > 0)) return say('Enter an amount' + label + '.', 'err');
      if (!lines[i].categoryId) return say('Pick a category' + label + '.', 'err');
      rows.push({
        date,
        merchant,
        category_id: lines[i].categoryId,
        amount: Math.round(amt * 100) / 100,
        source: 'manual',
      });
    }

    const btn = $('save');
    btn.disabled = true;
    const { error } = await db.from('line_items').insert(rows);
    btn.disabled = false;

    if (error) return say('Could not save: ' + error.message, 'err');

    $('merchant').value = '';
    lines = [newLine()];
    renderLines();
    say('Logged ' + rows.length + (rows.length > 1 ? ' entries.' : ' entry.'), 'ok');
    loadRecent();
  };

  // ---- Recent entries ----
  async function loadRecent() {
    const list = $('recent');
    const { data, error } = await db
      .from('line_items')
      .select('id,date,merchant,amount,categories(name)')
      .order('date', { ascending: false })
      .order('id', { ascending: false })
      .limit(15);

    list.replaceChildren();
    if (error) { list.append(el('li', 'empty', 'Could not load entries: ' + error.message)); return; }
    if (!data.length) { list.append(el('li', 'empty', 'Nothing logged yet. Your first entry will show up here.')); return; }

    data.forEach(row => {
      const li = el('li');
      const [, mm, dd] = row.date.split('-');
      li.append(el('span', 'r-date', Number(mm) + '/' + Number(dd)));
      li.append(el('span', 'r-merchant', row.merchant));
      li.append(el('span', 'r-amt', money(row.amount)));
      li.append(el('span', 'r-cat', row.categories ? row.categories.name : 'Uncategorized'));
      const del = el('button', 'link-btn r-del', 'Delete');
      del.type = 'button';
      del.onclick = async () => {
        if (!confirm('Delete ' + row.merchant + ' (' + money(row.amount) + ')?')) return;
        const { error: delErr } = await db.from('line_items').delete().eq('id', row.id);
        if (delErr) return say('Could not delete: ' + delErr.message, 'err');
        loadRecent();
      };
      li.append(del);
      list.append(li);
    });
  }

  // ---- Dashboard ----
  const FIRST_MONTH = '2026-09'; // the earliest month tab, even before it has data
  const MONTHLY_BUDGET = 1500;
  // Categories left out of the budget: any whose name contains this text
  const BUDGET_EXCLUDE = 'major experience';

  function nextYM(ym) {
    const [y, m] = ym.split('-').map(Number);
    return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0');
  }
  function monthName(ym, style) {
    const [y, m] = ym.split('-').map(Number);
    const opts = style === 'long' ? { month: 'long', year: 'numeric' } : { month: 'short' };
    return new Date(y, m - 1, 1).toLocaleString('en-US', opts);
  }
  function bigMoney(n) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(part, whole) { return whole > 0 ? (part / whole) * 100 : 0; }

  function setView(name) {
    $('view-log').classList.toggle('hidden', name !== 'log');
    $('view-dash').classList.toggle('hidden', name !== 'dash');
    $('title').textContent = name === 'log' ? 'Log a purchase' : 'Dashboard';
    document.querySelectorAll('#nav button').forEach(b => {
      if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (name === 'dash') refreshDashboard();
  }
  document.querySelectorAll('#nav button').forEach(b => { b.onclick = () => setView(b.dataset.view); });

  async function refreshDashboard() {
    await buildMonths();
    renderMonthTabs();
    await loadDashboard();
  }

  // Month tabs run from the first month through the current month, plus any month that has data
  async function buildMonths() {
    const [first, last] = await Promise.all([
      db.from('line_items').select('date').order('date', { ascending: true }).limit(1),
      db.from('line_items').select('date').order('date', { ascending: false }).limit(1),
    ]);
    const thisMonth = todayLocal().slice(0, 7);
    let start = FIRST_MONTH, end = thisMonth, latestWithData = null;
    if (first.data && first.data.length) {
      const ym = first.data[0].date.slice(0, 7);
      if (ym < start) start = ym;
    }
    if (last.data && last.data.length) {
      latestWithData = last.data[0].date.slice(0, 7);
      if (latestWithData > end) end = latestWithData;
    }
    months = [];
    for (let ym = start; ym <= end; ym = nextYM(ym)) months.push(ym);
    if (!activeMonth || !months.includes(activeMonth)) activeMonth = latestWithData || thisMonth;
  }

  function renderMonthTabs() {
    const wrap = $('month-tabs');
    wrap.replaceChildren();
    if (!months.length) return;
    const multiYear = months[0].slice(0, 4) !== months[months.length - 1].slice(0, 4);
    months.forEach(ym => {
      let label = monthName(ym);
      if (multiYear) label += ' ' + ym.slice(2, 4);
      const b = el('button', '', label);
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', monthName(ym, 'long'));
      b.setAttribute('aria-selected', String(ym === activeMonth));
      b.onclick = () => { activeMonth = ym; renderMonthTabs(); loadDashboard(); };
      wrap.append(b);
    });
    const sel = wrap.querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function catRow(name, amt, total, group) {
    const li = el('li', 'cat ' + group + (amt === 0 ? ' zero' : ''));
    const top = el('div', 'cat-top');
    top.append(el('span', 'cat-name', name));
    top.append(el('span', 'cat-amt', money(amt)));
    top.append(el('span', 'cat-pct', pct(amt, total).toFixed(1) + '%'));
    li.append(top);
    const track = el('div', 'bar-track');
    track.setAttribute('aria-hidden', 'true');
    const fill = el('div', 'bar-fill');
    fill.style.width = pct(amt, total) + '%';
    track.append(fill);
    li.append(track);
    return li;
  }

  async function loadDashboard() {
    const body = $('dash-body');
    const ym = activeMonth;
    body.replaceChildren(el('p', 'empty', 'Loading...'));

    const { data, error } = await db
      .from('line_items')
      .select('amount,categories(name,want_need)')
      .gte('date', ym + '-01')
      .lt('date', nextYM(ym) + '-01')
      .limit(5000);

    if (ym !== activeMonth) return; // another tab was picked while this one loaded
    body.replaceChildren();

    if (error) { body.append(el('p', 'err-text', 'Could not load this month: ' + error.message)); return; }
    if (!data.length) {
      body.append(el('p', 'empty', 'Nothing logged for ' + monthName(ym, 'long') + ' yet. Entries dated in this month, whether logged here or imported, will show up on this tab.'));
      return;
    }

    // Add up spend per category
    const byCat = new Map();
    let total = 0;
    data.forEach(r => {
      const name = r.categories ? r.categories.name : 'Uncategorized';
      const amt = Number(r.amount);
      byCat.set(name, (byCat.get(name) || 0) + amt);
      total += amt;
    });

    const groups = { Need: [], Want: [] };
    const groupTotal = { Need: 0, Want: 0 };
    categories.forEach(c => {
      const amt = byCat.get(c.name) || 0;
      groups[c.want_need].push({ name: c.name, amt });
      groupTotal[c.want_need] += amt;
    });

    // Month total
    const totalRow = el('div', 'dash-total');
    totalRow.append(el('span', 'cur', '$'));
    totalRow.append(el('span', 'num', bigMoney(total)));
    body.append(totalRow);
    body.append(el('p', 'dash-sub', data.length + (data.length === 1 ? ' entry' : ' entries') + ' in ' + monthName(ym, 'long')));

    // Monthly budget, not counting major experiences
    let excluded = 0;
    byCat.forEach((amt, name) => { if (name.toLowerCase().includes(BUDGET_EXCLUDE)) excluded += amt; });
    const budgetSpent = total - excluded;
    const over = budgetSpent > MONTHLY_BUDGET;
    body.append(el('h2', '', 'Monthly budget'));
    const bTop = el('div', 'budget-top');
    bTop.append(el('span', 'spent', money(budgetSpent) + ' of ' + money(MONTHLY_BUDGET) + '*'));
    bTop.append(el('span', 'left' + (over ? ' over' : ''),
      over ? money(budgetSpent - MONTHLY_BUDGET) + ' over' : money(MONTHLY_BUDGET - budgetSpent) + ' left'));
    body.append(bTop);
    const bTrack = el('div', 'budget-track');
    bTrack.setAttribute('aria-hidden', 'true');
    const bFill = el('div', 'budget-fill' + (over ? ' over' : ''));
    bFill.style.width = Math.min(pct(budgetSpent, MONTHLY_BUDGET), 100) + '%';
    bTrack.append(bFill);
    body.append(bTrack);
    body.append(el('p', 'footnote', '* Does not include major experiences'
      + (excluded > 0 ? ' (' + money(excluded) + ' this month).' : '.')));

    // Needs vs wants
    body.append(el('h2', '', 'Needs vs wants'));
    const bar = el('div', 'split-bar');
    bar.setAttribute('aria-hidden', 'true');
    const nSeg = el('span', 'n'); nSeg.style.width = pct(groupTotal.Need, total) + '%';
    const wSeg = el('span', 'w'); wSeg.style.width = pct(groupTotal.Want, total) + '%';
    bar.append(nSeg, wSeg);
    body.append(bar);

    const legend = el('div', 'legend');
    [['n', 'Needs', groupTotal.Need], ['w', 'Wants', groupTotal.Want]].forEach(([cls, label, amt]) => {
      const item = el('div');
      item.append(el('span', 'sw ' + cls));
      item.append(document.createTextNode(label + ' ' + money(amt) + ' (' + pct(amt, total).toFixed(1) + '%)'));
      legend.append(item);
    });
    body.append(legend);

    // By category, biggest first within each group
    body.append(el('h2', '', 'By category'));
    [['Need', 'Needs'], ['Want', 'Wants']].forEach(([key, label]) => {
      const head = el('div', 'group-head');
      head.append(el('h3', '', label));
      head.append(el('span', '', money(groupTotal[key])));
      body.append(head);
      const list = el('ul', 'cats');
      groups[key].sort((a, b) => b.amt - a.amt)
        .forEach(c => list.append(catRow(c.name, c.amt, total, key.toLowerCase())));
      body.append(list);
    });

    const uncategorized = byCat.get('Uncategorized') || 0;
    if (uncategorized > 0) {
      const head = el('div', 'group-head');
      head.append(el('h3', '', 'Uncategorized'));
      head.append(el('span', '', money(uncategorized)));
      body.append(head);
    }
  }

  // ---- Start ----
  db.auth.getSession().then(({ data }) => showForSession(data.session));
</script>
</body>
</html>
